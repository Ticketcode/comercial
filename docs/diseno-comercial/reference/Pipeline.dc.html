<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Propuestas, pipeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
.tc{--bg:#EEF0F6;--sf:#FFFFFF;--sf2:#E2E5F0;--ink:#12142B;--mut:#4A4F73;--bd:#C5CAE0;--ac:#1D3FBF;--acInk:#FFFFFF;--st:#12142B;--stInk:#FFFFFF;--hl:#E4E9FB;--hlInk:#1D3FBF;--wbg:#FFF1CC;--wink:#7A4B00;--inp:#FFFFFF;--dng:#B42318;color-scheme:light;}
.tc[data-theme="oscuro"]{--bg:#0E1020;--sf:#181B33;--sf2:#1F2340;--ink:#ECEEFB;--mut:#A3A9CF;--bd:#343A66;--ac:#8FA4FF;--acInk:#0E1020;--st:#ECEEFB;--stInk:#0E1020;--hl:#232A5C;--hlInk:#C3CFFF;--wbg:#3B2F10;--wink:#FFD27A;--inp:#11142B;--dng:#FF9A90;color-scheme:dark;}
@media (prefers-color-scheme: dark){.tc[data-theme="sistema"]{--bg:#0E1020;--sf:#181B33;--sf2:#1F2340;--ink:#ECEEFB;--mut:#A3A9CF;--bd:#343A66;--ac:#8FA4FF;--acInk:#0E1020;--st:#ECEEFB;--stInk:#0E1020;--hl:#232A5C;--hlInk:#C3CFFF;--wbg:#3B2F10;--wink:#FFD27A;--inp:#11142B;--dng:#FF9A90;color-scheme:dark;}}
a{color:var(--ac)}
.card:hover{border-color:var(--ac)!important}
.lrow:hover{background:var(--sf2)}
input::placeholder{color:var(--mut)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div class="tc" data-theme="{{theme}}" style="min-height: 820px; background: var(--bg); color: var(--ink); font-family: 'DM Sans', system-ui, sans-serif">
<div style="max-width: 1240px; margin: 0 auto; padding: 24px 32px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 8px; background: var(--sf); border-radius: 999px; padding: 6px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px; padding: 0 14px">Ticketcode</span>
<a href="Pipeline.dc.html" style="text-decoration: none; background: var(--ac); color: var(--acInk); font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 999px">Comercial</a>
<a href="#" style="text-decoration: none; color: var(--mut); font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 999px">Producción</a>
</div>
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<div role="group" aria-label="Tema de color" style="display: flex; gap: 2px; background: var(--sf); border-radius: 999px; padding: 3px">
<button onClick="{{setClaro}}" aria-pressed="{{claroOn}}" aria-label="Tema claro" title="Claro" style="{{claroStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
<button onClick="{{setOscuro}}" aria-pressed="{{oscuroOn}}" aria-label="Tema oscuro" title="Oscuro" style="{{oscuroStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
<button onClick="{{setSistema}}" aria-pressed="{{sistemaOn}}" aria-label="Tema del sistema" title="Sistema" style="{{sistemaStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
</div>
<button style="font-family: inherit; font-weight: 600; font-size: 13px; color: var(--mut); background: transparent; border: 1px solid var(--bd); border-radius: 999px; padding: 0 16px; min-height: 44px; cursor: pointer">Cerrar sesión</button>
</div>
</div>
<div style="max-width: 1240px; margin: 0 auto; padding: 40px 32px 48px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap">
<div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; font-size: 48px">Propuestas</h1>
<p style="margin: 10px 0 0; font-size: 15px; color: var(--mut)">Equipo comercial — Ticketcode</p>
</div>
<div style="display: flex; gap: 12px; flex-wrap: wrap">
<button style="font-family: inherit; font-weight: 600; font-size: 14px; color: var(--ink); background: var(--sf); border: 0; border-radius: 999px; padding: 0 20px; min-height: 44px; cursor: pointer">Catálogo de precios</button>
<button style="font-family: inherit; font-weight: 700; font-size: 14px; color: var(--stInk); background: var(--st); border: 0; border-radius: 999px; padding: 0 22px; min-height: 44px; cursor: pointer">+ Nueva propuesta</button>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 36px; align-items: flex-start">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="3">
<div style="flex: 1 1 320px; min-width: 0; background: var(--sf2); border-radius: 20px; padding: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 14px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="{{c.dot}}"></span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px">{{c.nombre}}</span>
</div>
<span style="font-size: 13px; font-weight: 700; color: var(--mut); background: var(--sf); border-radius: 999px; padding: 3px 11px">{{c.total}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{c.items}}" as="r" hint-placeholder-count="2">
<a href="{{r.href}}" class="card" style="display: block; text-decoration: none; color: var(--ink); background: var(--sf); border: 1.5px solid transparent; border-radius: 14px; padding: 18px">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; line-height: 1.25">{{r.evento}}</div>
<div style="font-size: 13px; color: var(--mut); margin-top: 4px">{{r.cliente}}</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 16px; font-size: 13px; color: var(--mut)">
<span>{{r.ciudad}}</span>
<span style="font-weight: 700; color: var(--ink)">{{r.aforo}}</span>
</div>
</a>
</sc-for>
</div>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
renderVals() {
const th = (this.state && this.state.theme) || 'sistema';
const tb = id => 'width:44px;height:40px;border:0;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;' + (th === id ? 'background:var(--st);color:var(--stInk)' : 'background:transparent;color:var(--mut)');
const theme = { theme: th, setClaro: () => this.setState({ theme: 'claro' }), setOscuro: () => this.setState({ theme: 'oscuro' }), setSistema: () => this.setState({ theme: 'sistema' }), claroStyle: tb('claro'), oscuroStyle: tb('oscuro'), sistemaStyle: tb('sistema'), claroOn: th === 'claro', oscuroOn: th === 'oscuro', sistemaOn: th === 'sistema' };
const data = [
['Colombia 5.0 - Popayan','Sin ciudad','sas','Aforo —','Tarifario','Tarifario.dc.html'],
['Colombia 5.0 - Leticia','Leticia','MINTIC','Aforo 0','Cerrada','#'],
['Colombia 5.0 - Ciudad Bolívar','Bogotá','MINTIC','Aforo 0','Cerrada','#'],
['Evento Prueba Precios','Bogotá','Cliente Prueba 2','Aforo 500','Cerrada','#'],
['Héroes Fest 2026','Neiva','Luisa Pira · Innpulsa','Aforo 3500','Contrato','#']
];
const dots = { Tarifario:'#E39A0B', Contrato:'var(--ac)', Cerrada:'#7C829E' };
const mk = n => ({ nombre:n, dot:'width:10px;height:10px;border-radius:50%;background:' + dots[n], items: data.filter(d => d[4] === n).map(d => ({ evento:d[0], ciudad:d[1], cliente:d[2], aforo:d[3], href:d[5] })) });
const cols = ['Tarifario','Contrato','Cerrada'].map(mk);
cols.forEach(c => c.total = c.items.length);
return { ...theme, cols };
}
}
</script>
</body>
</html>
